<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FinBee</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='images/finbee-logo.png') }}">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f172a">

</head>
<body>

<!-- ================= NAVBAR ================= -->
<div class="navbar">

  <!-- LEFT : BRAND -->
  <div class="brand">
    <img src="{{ url_for('static', filename='images/finbee-logo.png') }}"
         alt="FinBee"
         class="brand-logo">
    <span class="brand-text">FinBee</span>
  </div>

  <!-- CENTER : NAV LINKS -->
  <div class="nav-center">
    <a href="/">Home</a>
    <a href="/accounts">Accounts</a>
    <a href="/transactions">Transactions</a>
    <a href="/insights">Insights</a>
    <a href="/dashboard">Dashboard</a>
  </div>

  <!-- RIGHT : PROFILE -->
  <div class="nav-right">
    <a href="/profile" class="profile-link">
        <img src="{% if current_user.profile_pic.startswith('default') %}{{ url_for('static', filename='profile/' + current_user.profile_pic) }}{% else %}{{ url_for('uploaded_file', filename=current_user.profile_pic) }}{% endif %}?v={{ current_user.profile_pic }}"
             onerror="this.src='{{ url_for('static', filename='images/finbee-logo.png') }}'"
             class="nav-avatar"
             alt="Profile"
        >
      <span class="username">{{ current_user.name }}</span>
    </a>

    <a href="/logout" class="logout-link">Logout</a>
  </div>

</div>
<!-- ================= END NAVBAR ================= -->

<main class="container">
  {% block content %}{% endblock %}
</main>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/static/sw.js");
}
</script>

</body>
</html>
